name: "Docker"

on:
  workflow_dispatch:

  push:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Node
          - item: node6
          - item: node7
          - item: node8
          - item: node9
          - item: node10
          - item: node11
          - item: node12
          - item: node13
          - item: node14
          - item: node15
          - item: node16
          - item: node17
          - item: node18
          - item: node19
          - item: node20
          - item: node21
          - item: node22
          - item: node23
          - item: node24
          - item: node26
          # PHP
          - item: php56
          - item: php70
          - item: php71
          - item: php72
          - item: php73
          - item: php74
          - item: php80
          - item: php81
          - item: php82
          - item: php83
          - item: php84
          - item: php85
          # Ansitest
          - item: ansitest

      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.item }}
          tags: dockette/ci:${{ matrix.item }}
          platforms: linux/amd64
          load: true
          cache-from: type=gha

      - name: Test image
        run: .scripts/test.sh ${{ matrix.item }}

  build:
    name: "Build"
    needs: test
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
      image: "dockette/ci"
      tag: "${{ matrix.item }}"
      context: "${{ matrix.item }}"
      push: ${{ github.ref == 'refs/heads/master' }}
    strategy:
      matrix:
        include:
          # Node
          - item: node6
          - item: node7
          - item: node8
          - item: node9
          - item: node10
          - item: node11
          - item: node12
          - item: node13
          - item: node14
          - item: node15
          - item: node16
          - item: node17
          - item: node18
          - item: node19
          - item: node20
          - item: node21
          - item: node22
          - item: node23
          - item: node24
          - item: node26
          # PHP
          - item: php56
          - item: php70
          - item: php71
          - item: php72
          - item: php73
          - item: php74
          - item: php80
          - item: php81
          - item: php82
          - item: php83
          - item: php84
          - item: php85
          # Ansitest
          - item: ansitest

      fail-fast: false

  docs:
    name: "Docs"
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dockette/ci
